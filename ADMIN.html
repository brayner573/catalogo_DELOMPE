<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | URBANO</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="admin-body">

  <!-- ============ LOGIN SCREEN ============ -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <h1 class="login-logo">URBANO</h1>
      <p class="login-sub">Panel Administrador</p>
      <div id="loginError" class="alert alert-error" style="display:none"></div>
      <div class="form-group">
        <label for="loginEmail">Correo</label>
        <input type="email" id="loginEmail" placeholder="admin@correo.com" autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="loginPassword">Contraseña</label>
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button class="btn btn-primary btn-full" id="loginBtn">Iniciar sesión</button>
    </div>
  </div>

  <!-- ============ ADMIN PANEL ============ -->
  <div class="admin-panel" id="adminPanel" style="display:none">

    <!-- Sidebar / Header admin -->
    <header class="admin-header">
      <span class="logo">URBANO <span class="admin-badge">ADMIN</span></span>
      <button class="btn btn-outline btn-sm" id="logoutBtn">Cerrar sesión</button>
    </header>

    <div class="admin-content">

      <!-- ======= FORMULARIO PRODUCTO ======= -->
      <section class="admin-card" id="formSection">
        <h2 class="section-title" id="formTitle">Agregar Producto</h2>

        <!-- Alerta de éxito/error -->
        <div id="formAlert" class="alert" style="display:none"></div>

        <!-- Imagen -->
        <div class="form-group">
          <label>Imagen del producto</label>
          <div class="image-area" id="imageArea">
            <img id="imgPreview" src="" alt="Vista previa" style="display:none" />
            <div class="image-placeholder" id="imagePlaceholder">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              <p>Sin imagen</p>
            </div>
          </div>
          <div class="image-btns">
            <button class="btn btn-secondary btn-sm" id="openCameraBtn" type="button">
              📷 Abrir cámara
            </button>
            <label class="btn btn-secondary btn-sm" for="galleryInput">
              🖼️ Desde galería
            </label>
            <input type="file" id="galleryInput" accept="image/*" style="display:none" />
          </div>
          <!-- Vista de cámara -->
          <div class="camera-section" id="cameraSection" style="display:none">
            <video id="cameraVideo" autoplay playsinline muted></video>
            <canvas id="cameraCanvas" style="display:none"></canvas>
            <div class="camera-controls">
              <button class="btn btn-primary" id="captureBtn" type="button">⬤ Tomar foto</button>
              <button class="btn btn-outline btn-sm" id="closeCameraBtn" type="button">Cancelar</button>
            </div>
          </div>
        </div>

        <!-- Campos del producto -->
        <div class="form-group">
          <label for="prodName">Nombre del producto *</label>
          <input type="text" id="prodName" placeholder="Ej: Polo Oversize Negro" required />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="prodPrice">Precio (S/) *</label>
            <input type="number" id="prodPrice" placeholder="59.90" min="0" step="0.10" required />
          </div>
          <div class="form-group">
            <label for="prodCategory">Categoría *</label>
            <select id="prodCategory">
              <option value="">Seleccionar</option>
              <option value="Polos">Polos</option>
              <option value="Casacas">Casacas</option>
              <option value="Pantalones">Pantalones</option>
              <option value="Zapatillas">Zapatillas</option>
              <option value="Accesorios">Accesorios</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="prodSizes">Tallas disponibles (separadas por coma)</label>
          <input type="text" id="prodSizes" placeholder="XS, S, M, L, XL" />
        </div>

        <div class="form-group">
          <label for="prodColors">Colores disponibles (separados por coma)</label>
          <input type="text" id="prodColors" placeholder="Negro, Blanco, Gris" />
        </div>

        <div class="form-group">
          <label for="prodStatus">Estado</label>
          <select id="prodStatus">
            <option value="Nuevo">Nuevo</option>
            <option value="Oferta">Oferta</option>
            <option value="Más vendido">Más vendido</option>
          </select>
        </div>

        <div class="form-group">
          <label for="prodDesc">Descripción</label>
          <textarea id="prodDesc" rows="3" placeholder="Describe el producto..."></textarea>
        </div>

        <div class="form-actions">
          <button class="btn btn-primary btn-full" id="saveProductBtn" type="button">
            <span id="saveBtnText">Guardar producto</span>
            <span class="btn-loader" id="saveBtnLoader" style="display:none">Guardando...</span>
          </button>
          <button class="btn btn-ghost btn-full" id="cancelEditBtn" type="button" style="display:none">
            Cancelar edición
          </button>
        </div>
      </section>

      <!-- ======= LISTADO DE PRODUCTOS ======= -->
      <section class="admin-card" id="productListSection">
        <h2 class="section-title">Productos registrados</h2>
        <div id="adminProductList" class="admin-product-list">
          <p class="loading-text">Cargando productos...</p>
        </div>
      </section>

    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
