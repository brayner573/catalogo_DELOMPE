<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Ropa</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Fuente Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo">URBAN CATALOG</div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Buscar por nombre...">
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
            <a href="#" id="adminLink" class="admin-link"><i class="fas fa-user-shield"></i> Administrador</a>
        </div>
    </header>

    <div id="catalogSection">

    <section class="filters-section">
        <div class="filters-container" id="categoryFilters">
            <button class="filter-btn active" data-category="Todos">Todos</button>
            <button class="filter-btn" data-category="Polos">Polos</button>
            <button class="filter-btn" data-category="Casacas">Casacas</button>
            <button class="filter-btn" data-category="Pantalones">Pantalones</button>
            <button class="filter-btn" data-category="Zapatillas">Zapatillas</button>
            <button class="filter-btn" data-category="Accesorios">Accesorios</button>
        </div>
    </section>

    <main>
        <div id="loader" class="loader-container">
            <div class="loader"></div>
        </div>
        <div class="products-grid" id="productsGrid">
            <!-- Los productos se cargarán dinámicamente aquí -->
        </div>
    </main>

    <!-- Botón flotante WhatsApp (Cambiar número en script.js) -->
    <a href="#" class="floating-whatsapp" id="floatingWhatsapp" target="_blank" aria-label="Contactar por WhatsApp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <!-- Modal Detalles del Producto -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div id="modalDetails"></div>
        </div>
    </div>
    </div> <!-- Fin catalogSection -->

    <!-- Login Section -->
    <div id="loginSection" class="login-container" style="display: none;">
        <h2>Acceso Administrador</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-primary" id="loginBtn">Ingresar</button>
            <p id="loginError" style="color: red; margin-top: 10px; display: none; text-align: center;"></p>
        </form>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboardSection" class="dashboard-container" style="display: none;">
        <div class="dashboard-header">
            <h2>Panel de Administración</h2>
            <div>
                <a href="#" id="viewCatalogBtn" class="admin-link" style="color: var(--primary-color); margin-right: 15px;">Ver Catálogo</a>
                <button id="logoutBtn" class="btn-danger"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</button>
            </div>
        </div>

        <div class="admin-grid">
            <!-- Formulario de Nuevo Producto -->
            <div class="admin-card">
                <h3>Agregar Producto</h3>
                <form id="addProductForm">
                    <div class="form-group">
                        <label>Imagen del Producto</label>
                        <div class="camera-container">
                            <video id="camera-view" autoplay playsinline></video>
                            <img id="image-preview" alt="Vista previa">
                            
                            <div class="camera-controls">
                                <button type="button" id="startCameraBtn" class="btn-camera"><i class="fas fa-camera"></i> Abrir Cámara</button>
                                <button type="button" id="takePhotoBtn" class="btn-camera" style="display:none;"><i class="fas fa-camera-retro"></i> Tomar Foto</button>
                            </div>
                            
                            <div class="file-upload-wrapper">
                                <label for="imageUpload" style="cursor: pointer; color: var(--accent-color); font-weight: bold;">
                                    <i class="fas fa-upload"></i> o subir desde galería
                                </label>
                                <input type="file" id="imageUpload" accept="image/*" style="display: none;">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="prodName">Nombre del producto</label>
                        <input type="text" id="prodName" required>
                    </div>

                    <div class="form-group">
                        <label for="prodPrice">Precio (S/)</label>
                        <input type="number" id="prodPrice" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="prodCategory">Categoría</label>
                        <select id="prodCategory" required>
                            <option value="Polos">Polos</option>
                            <option value="Casacas">Casacas</option>
                            <option value="Pantalones">Pantalones</option>
                            <option value="Zapatillas">Zapatillas</option>
                            <option value="Accesorios">Accesorios</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="prodSizes">Tallas disponibles (ej. S, M, L)</label>
                        <input type="text" id="prodSizes" required>
                    </div>

                    <div class="form-group">
                        <label for="prodColors">Colores disponibles (ej. Negro, Blanco)</label>
                        <input type="text" id="prodColors" required>
                    </div>

                    <div class="form-group">
                        <label for="prodStatus">Estado</label>
                        <select id="prodStatus">
                            <option value="Normal">Normal</option>
                            <option value="Nuevo">Nuevo</option>
                            <option value="Oferta">Oferta</option>
                            <option value="Más vendido">Más vendido</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="prodDesc">Descripción</label>
                        <textarea id="prodDesc" rows="3"></textarea>
                    </div>

                    <button type="submit" class="btn-primary" id="saveProductBtn">Guardar Producto</button>
                    <p id="uploadStatus" style="margin-top: 10px; text-align: center;"></p>
                </form>
            </div>

            <!-- Lista de Productos -->
            <div class="admin-card">
                <h3>Productos Registrados</h3>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Img</th>
                                <th>Nombre</th>
                                <th>Precio</th>
                                <th>Categoría</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="adminProductsList">
                            <!-- Filas de productos dinámicas -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts (Se usa module para importar Firebase modular) -->
    <script type="module" src="script.js"></script>
    <script type="module" src="admin.js"></script>
</body>
</html>
