<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URBANO | Tienda de Ropa</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <!-- SEO básico -->
  <meta name="description" content="Tienda de ropa urbana. Polos, casacas, pantalones, zapatillas y accesorios." />
</head>
<body>

  <!-- ============ HEADER ============ -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">URBANO</a>
      <nav class="header-nav">
        <a href="admin.html" class="nav-admin-link">Admin</a>
      </nav>
    </div>
    <!-- Barra de búsqueda -->
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Buscar producto..." aria-label="Buscar producto" />
      <span class="search-icon">&#9906;</span>
    </div>
  </header>

  <!-- ============ HERO ============ -->
  <section class="hero">
    <div class="hero-content">
      <p class="hero-sub">Nueva Colección</p>
      <h1 class="hero-title">ESTILO<br/>SIN<br/>LÍMITES</h1>
      <a href="#catalogo" class="hero-cta">Ver catálogo</a>
    </div>
    <div class="hero-overlay"></div>
  </section>

  <!-- ============ FILTROS ============ -->
  <section class="filter-section" id="catalogo">
    <div class="filter-chips">
      <button class="chip active" data-cat="all">Todos</button>
      <button class="chip" data-cat="Polos">Polos</button>
      <button class="chip" data-cat="Casacas">Casacas</button>
      <button class="chip" data-cat="Pantalones">Pantalones</button>
      <button class="chip" data-cat="Zapatillas">Zapatillas</button>
      <button class="chip" data-cat="Accesorios">Accesorios</button>
    </div>
  </section>

  <!-- ============ CATÁLOGO ============ -->
  <main class="catalog-section">
    <div class="catalog-grid" id="catalogGrid">
      <!-- Skeleton loader -->
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
    <p class="empty-msg" id="emptyMsg" style="display:none">No se encontraron productos.</p>
  </main>

  <!-- ============ MODAL PRODUCTO ============ -->
  <div class="modal-overlay" id="productModal" role="dialog" aria-modal="true" aria-labelledby="modalName">
    <div class="modal-card">
      <button class="modal-close" id="modalClose" aria-label="Cerrar">&#10005;</button>
      <div class="modal-img-wrap">
        <img id="modalImg" src="" alt="Producto" />
        <span class="modal-badge" id="modalBadge"></span>
      </div>
      <div class="modal-info">
        <p class="modal-cat" id="modalCat"></p>
        <h2 class="modal-name" id="modalName"></h2>
        <p class="modal-price" id="modalPrice"></p>
        <div class="modal-meta">
          <div><span class="meta-label">Tallas</span><span id="modalSizes"></span></div>
          <div><span class="meta-label">Colores</span><span id="modalColors"></span></div>
        </div>
        <p class="modal-desc" id="modalDesc"></p>
        <a class="btn-whatsapp" id="modalWhatsapp" href="#" target="_blank" rel="noopener">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          Pedir por WhatsApp
        </a>
      </div>
    </div>
  </div>

  <!-- ============ BOTÓN FLOTANTE WHATSAPP ============ -->
  <a class="fab-whatsapp" id="fabWhatsapp" href="#" target="_blank" rel="noopener" aria-label="Contactar por WhatsApp">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
  </a>

  <!-- ============ FOOTER ============ -->
  <footer class="site-footer">
    <p>&copy; 2025 URBANO — Todos los derechos reservados.</p>
  </footer>

  <script type="module" src="script.js"></script>
</body>
</html>
